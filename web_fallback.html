<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WanderWith | Open in App</title>
    <!-- Social Preview Tags (Meta) -->
    <meta property="og:title" content="WanderWith Profile">
    <meta property="og:description" content="Check out this profile on WanderWith, the most intentional travel app.">
    <meta property="og:image" content="https://www.wanderwith.online/icon.png">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #f9f9f9;
            color: #333;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .icon {
            width: 80px;
            height: 80px;
            background: #E3F2FD;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            color: #2196F3;
            font-size: 2rem;
        }

        h1 {
            margin: 0 0 0.5rem;
            font-size: 1.5rem;
        }

        p {
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .btn {
            display: block;
            background: #2196F3;
            color: white;
            text-decoration: none;
            padding: 1rem;
            border-radius: 12px;
            font-weight: bold;
            margin-bottom: 1rem;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #1976D2;
        }

        .btn-secondary {
            background: #eee;
            color: #666;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon">🌍</div>
        <h1>WanderWith</h1>
        <p>One moment... we're opening your link in the app for the best experience.</p>

        <a href="https://www.wanderwith.online/u/test" id="open-btn" class="btn">Open in App</a>
        <a href="https://play.google.com/store/apps/details?id=com.tejuice.wanderwith"
            class="btn btn-secondary">Download WanderWith</a>
    </div>

    <script>
        // Automatic Redirect Logic
        // Since use verified App Links (Android), this page might only be seen if app is NOT installed.
        // But if they landed here, we can try a custom scheme as a last resort.
        const path = window.location.pathname; // e.g., /u/test
        const customScheme = "wanderwith:/" + path;

        // Try to trigger the app via custom scheme
        setTimeout(() => {
            window.location.href = customScheme;
        }, 500);

        // Fallback to Play Store after 3 seconds if still on this page
        setTimeout(() => {
            // Optional: Auto-redirect to store if you want
            // window.location.href = "https://play.google.com/store/apps/details?id=com.tejuice.wanderwith";
        }, 3000);
    </script>
</body>

</html>
